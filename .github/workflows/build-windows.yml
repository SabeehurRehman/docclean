name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build DocClean.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DocClean --icon icon.ico --add-data "icon.ico;." --add-data "models/u2netp.onnx;models" app.py
      - name: Self-test the built .exe on Windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DocClean.exe" -ArgumentList "--selftest","selftest-out" -Wait -PassThru
          Get-Content selftest-out\selftest.log
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          Get-ChildItem selftest-out, dist
      - uses: actions/upload-artifact@v4
        with:
          name: DocClean-windows
          path: dist/DocClean.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-output
          path: selftest-out/

  release:
    # Publishes DocClean.exe as a public download when a version tag (v1.0.0, ...) is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DocClean-windows
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" DocClean.exe \
            --repo "${{ github.repository }}" \
            --title "DocClean ${{ github.ref_name }}" \
            --notes "**Download:** DocClean.exe below (Windows 10/11, 64-bit). No installation needed – just double-click it.

          First launch: if Windows shows *Windows protected your PC*, click **More info → Run anyway** (the app is not code-signed). The first start takes a few seconds."
